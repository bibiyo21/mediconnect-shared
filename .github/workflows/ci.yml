# Build, type-check and test the shared packages, and fail if the generated API
# client is out of date with the backend's committed OpenAPI contract.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: shared
      # Contract source for check:generated (../backend/openapi/openapi.json).
      - uses: actions/checkout@v5
        with:
          repository: bibiyo21/mediconnect-backend
          path: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shared/pnpm-lock.yaml
      - name: Install
        working-directory: shared
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: shared
        run: pnpm build
      - name: Type-check
        working-directory: shared
        run: pnpm typecheck
      - name: Test
        working-directory: shared
        run: pnpm test
      - name: Generated API client matches the backend contract
        working-directory: shared
        run: pnpm check:generated
